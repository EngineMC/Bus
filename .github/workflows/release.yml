name: Release

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  statuses: write

jobs:
  release:
    uses: SCsupercraft/maven.scsupercraft.dev/.github/workflows/gradle-publish.yml@main
    with:
      java-version: 17
      pre_gradle_tasks: test
      gradle_tasks: publish 
    secrets:
      maven-repository-token: ${{ secrets.MAVEN_REPOSITORY_TOKEN }}
      